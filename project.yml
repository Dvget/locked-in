name: LockedIn
options:
  bundleIdPrefix: app.lockedin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.lockedin.tracker
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 31
    MARKETING_VERSION: 0.7.2
targets:
  LockedIn:
    type: application
    platform: iOS
    sources:
      - LockedIn
      - Shared
    dependencies:
      - target: LockedInLiveActivity
    info:
      path: LockedIn/Info.plist
      properties:
        CFBundleDisplayName: "LOCKED IN"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "LOCKED IN verbindet sich kurz mit deiner Etekcity-Waage, um dein Körpergewicht zu übernehmen."
        NSMotionUsageDescription: "LOCKED IN liest die iPhone-Schrittzählung, um deine Steps und Wochenziele anzuzeigen."
        NSLocationWhenInUseUsageDescription: "LOCKED IN verwendet deinen Standort, um Distanz, Pace und Höhenmeter während eines Laufs aufzuzeichnen."
        NSLocationAlwaysAndWhenInUseUsageDescription: "LOCKED IN zeichnet deinen aktiven Lauf auch bei gesperrtem Bildschirm zuverlässig weiter auf."
        NSSupportsLiveActivities: true
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_NAME: "LOCKED IN"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  LockedInLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LockedInLiveActivity
      - Shared
      - path: LockedIn/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockedin.tracker.liveactivity
        PRODUCT_NAME: "LOCKED IN Live Activity"
        INFOPLIST_FILE: LockedInLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
