name: LockedIn
options:
  bundleIdPrefix: app.lockedin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.lockedin.tracker
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 21
    MARKETING_VERSION: 0.5.1
targets:
  LockedIn:
    type: application
    platform: iOS
    sources:
      - LockedIn
      - Shared
    dependencies:
      - target: LockedInLiveActivity
    settings:
      base:
        PRODUCT_NAME: "LOCKED IN"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LOCKED IN"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "LOCKED IN verbindet sich kurz mit deiner Etekcity-Waage, um dein Körpergewicht zu übernehmen."
        INFOPLIST_KEY_NSMotionUsageDescription: "LOCKED IN liest die iPhone-Schrittzählung, um deine Steps und Wochenziele anzuzeigen."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  LockedInLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LockedInLiveActivity
      - Shared
      - path: LockedIn/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockedin.tracker.liveactivity
        PRODUCT_NAME: "LOCKED IN Live Activity"
        INFOPLIST_FILE: LockedInLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
