name: Build LOCKED IN IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, codex/locked-in-0.7.2 ]
    paths: [ '.build-trigger' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run analytics tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project LockedIn.xcodeproj \
            -scheme LockedIn \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Verify running background location capability
        run: |
          APP_PLIST="build/Build/Products/Debug-iphoneos/LOCKED IN.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PLIST" | grep -q "location"
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Debug-iphoneos/LOCKED IN.app" Payload/
          zip -r LockedIn.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LockedIn-IPA
          path: LockedIn.ipa
